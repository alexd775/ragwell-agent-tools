name: Release

on:
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: Publish the tagged Python distributions to PyPI
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security:
    name: Secret, dependency, license and SBOM gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan exact committed source
        run: bash scripts/source-security.sh
      - name: Preserve security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-security-reports
          path: .security-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  build:
    name: Build and qualify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          python-version: "3.11"
          enable-cache: true
      - name: Verify release identity
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
            test "${GITHUB_REF_NAME}" = "v${version}"
          fi
      - name: Install locked environment
        run: uv sync --locked
      - name: Format, lint and type check
        run: |
          uv run --locked --no-sync ruff format --check .
          uv run --locked --no-sync ruff check .
          uv run --locked --no-sync mypy
      - name: Test without external services
        run: uv run --locked --no-sync pytest
      - name: Record installed runtime and development license declarations
        run: uv run --locked --no-sync python scripts/license_inventory.py release-evidence/installed-licenses.json --source-commit "${GITHUB_SHA}"
      - name: Verify public guides and sample pack
        run: |
          uv run --locked --no-sync python scripts/check_documents.py
          uv run --locked --no-sync python scripts/build_sample_pack.py --check
      - name: Build and inspect public archives
        run: |
          uv run --locked --no-sync python -m build --no-isolation
          uv run --locked --no-sync python scripts/check_public_artifacts.py
      - name: Qualify clean wheel using public dependencies
        run: uv run --locked --no-sync python scripts/qualify_artifact.py
      - name: Record source and distribution hashes
        run: |
          mkdir -p release-evidence
          printf '{"source_commit":"%s"}\n' "${GITHUB_SHA}" > release-evidence/source.json
          sha256sum dist/*.whl dist/*.tar.gz > release-evidence/SHA256SUMS
          cat release-evidence/SHA256SUMS
      - name: Preserve immutable distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve release provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30

  publish-pypi:
    name: Publish verified distributions to PyPI
    if: github.ref_type == 'tag' && github.event_name == 'workflow_dispatch' && inputs.publish_pypi
    needs: [security, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/ragwell-agent-tools
    permissions:
      id-token: write
    steps:
      - name: Retrieve immutable distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish through the configured Trusted Publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          print-hash: true

  build-binary:
    name: Build and qualify ragwel-cli / ${{ matrix.platform }}
    if: github.event_name != 'workflow_dispatch' || !inputs.publish_pypi
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: macos-arm64
            runner: macos-15
    env:
      UV_MANAGED_PYTHON: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          python-version: "3.12.14"
          enable-cache: true
      - name: Install locked build inputs
        run: uv sync --locked --no-dev --group binary
      - name: Freeze the Ragwell MCP adapter
        run: uv run --locked --no-sync --no-dev --group binary python scripts/build_binary.py
      - name: Qualify the executable on the native runner
        run: uv run --locked --no-sync --no-dev --group binary python scripts/qualify_binary.py --binary dist/binary/ragwel-cli
      - name: Qualify in a Linux image without Python
        if: runner.os == 'Linux'
        run: >-
          uv run --locked --no-sync --no-dev --group binary python scripts/qualify_binary.py
          --binary dist/binary/ragwel-cli
          --sandbox-image ubuntu@sha256:74b12b11ffa550fba1929ad4d8d16533c34f6612728469671afba1b03b66881c
          --peer-image python@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
      - name: Stage the qualified executable and record its hash
        shell: bash
        env:
          RAGWELL_RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          version="$(uv run --locked --no-sync --no-dev --group binary python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$(dist/binary/ragwel-cli --version)" = "$version"
          asset="ragwel-cli-v${version}-${RAGWELL_RELEASE_PLATFORM}"
          mkdir release-binary
          mv dist/binary/ragwel-cli "release-binary/$asset"
          # Use the source notices for the CPython distribution selected by uv 0.12.17.
          curl --fail --silent --show-error --location --max-time 60 \
            https://codeload.github.com/astral-sh/python-build-standalone/tar.gz/refs/tags/20260901 \
            --output "$RUNNER_TEMP/python-build-source.tar.gz"
          uv run --locked --no-sync --no-dev --group binary python scripts/binary_notices.py \
            --python-build-source "$RUNNER_TEMP/python-build-source.tar.gz" \
            --output "release-binary/$asset.NOTICES.txt"
          cd release-binary
          shasum -a 256 "$asset" "$asset.NOTICES.txt" > "$asset.sha256"
      - name: Preserve the qualified executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ragwell-binary-${{ matrix.platform }}
          path: release-binary/
          if-no-files-found: error
          retention-days: 30

  publish-binaries:
    name: Publish executables to GitHub Releases
    if: github.ref_type == 'tag' && (github.event_name != 'workflow_dispatch' || !inputs.publish_pypi)
    needs: [security, build, build-binary]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Retrieve qualified executables
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: ragwell-binary-*
          path: release-binary/
          merge-multiple: true
      - name: Verify hashes and publish the tagged release
        working-directory: release-binary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RAGWELL_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          linux="ragwel-cli-${RAGWELL_RELEASE_TAG}-linux-x86_64"
          macos="ragwel-cli-${RAGWELL_RELEASE_TAG}-macos-arm64"
          cat "$linux.sha256" "$macos.sha256" > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          release_flags=()
          if [[ "$RAGWELL_RELEASE_TAG" =~ (a|b|rc)[0-9]+ ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RAGWELL_RELEASE_TAG" \
            "$linux" "$macos" "$linux.NOTICES.txt" "$macos.NOTICES.txt" SHA256SUMS \
            --verify-tag --title "Ragwell ${RAGWELL_RELEASE_TAG}" --generate-notes \
            "${release_flags[@]}"
