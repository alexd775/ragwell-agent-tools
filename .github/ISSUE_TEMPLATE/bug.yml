name: Integration problem
description: Report a hosted connection, local tool or setup problem
body:
  - type: markdown
    attributes:
      value: "Omit API keys, private document/query text, raw protocol logs and configurations containing secrets. Use private support for account-specific issues."
  - type: input
    id: environment
    attributes:
      label: Agent, account surface, version and operating system
      description: For hosted connections, include ChatGPT Personal or Claude web and the model if visible. Omit account identifiers.
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Ragwell tools package version or hosted connection
      description: For browser-only setup, write hosted; no local package is needed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Setup step and expected versus observed behavior
      description: Use synthetic examples without private data.
    validations:
      required: true
  - type: input
    id: diagnostic
    attributes:
      label: Sanitized error code and optional request ID
